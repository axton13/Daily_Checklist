<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Checklist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom right, #eff6ff, #e0e7ff);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 48rem;
            margin: 0 auto;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .progress-text {
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .progress-bar {
            background: #e5e7eb;
            border-radius: 9999px;
            height: 0.75rem;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .progress-fill {
            background: #6366f1;
            height: 100%;
            transition: width 0.3s;
        }

        .input-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        #taskInput {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
        }

        #taskInput:focus {
            border-color: #6366f1;
        }

        .add-btn {
            background: #6366f1;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-btn:hover {
            background: #4f46e5;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: #f9fafb;
            border-radius: 0.5rem;
            transition: background 0.2s;
        }

        .task-item:hover {
            background: #f3f4f6;
        }

        .checkbox {
            width: 1.5rem;
            height: 1.5rem;
            border: 2px solid #d1d5db;
            border-radius: 0.25rem;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .checkbox.checked {
            background: #6366f1;
            border-color: #6366f1;
        }

        .checkbox:hover {
            border-color: #a5b4fc;
        }

        .task-text {
            flex: 1;
            color: #1f2937;
        }

        .task-text.completed {
            color: #9ca3af;
            text-decoration: line-through;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            padding: 0.25rem;
        }

        .delete-btn:hover {
            color: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 0;
            color: #9ca3af;
        }

        svg {
            width: 1.25rem;
            height: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <h1>Daily Checklist</h1>
            <p class="progress-text" id="progressText">0 of 0 tasks completed</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button class="add-btn" onclick="addTask()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Add
            </button>
        </div>

        <div class="task-list" id="taskList"></div>
    </div>

    <script>
        let tasks = [
            { id: 1, text: 'Morning exercise', completed: false },
            { id: 2, text: 'Drink 8 glasses of water', completed: false },
            { id: 3, text: 'Read for 30 minutes', completed: false }
        ];

        function render() {
            const taskList = document.getElementById('taskList');
            const completedCount = tasks.filter(t => t.completed).length;
            const totalCount = tasks.length;
            
            // Update progress
            document.getElementById('progressText').textContent = 
                `${completedCount} of ${totalCount} tasks completed`;
            document.getElementById('progressFill').style.width = 
                totalCount > 0 ? `${(completedCount / totalCount) * 100}%` : '0%';

            // Render tasks
            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state">No tasks yet. Add one to get started!</div>';
                return;
            }

            taskList.innerHTML = tasks.map(task => `
                <div class="task-item">
                    <div class="checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})">
                        ${task.completed ? `
                            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        ` : ''}
                    </div>
                    <span class="task-text ${task.completed ? 'completed' : ''}">${task.text}</span>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            
            if (text) {
                tasks.push({ id: Date.now(), text: text, completed: false });
                input.value = '';
                render();
            }
        }

        function toggleTask(id) {
            tasks = tasks.map(task => 
                task.id === id ? { ...task, completed: !task.completed } : task
            );
            render();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            render();
        }

        // Allow Enter key to add task
        document.getElementById('taskInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Initial render
        render();
    </script>
</body>
</html>
